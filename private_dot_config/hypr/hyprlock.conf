general {
    hide_cursor = true
    grace = 5
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 1.1
    brightness = 0.8
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    color = rgba(D8DEE9FF)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(88C0D0FF)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 55
    position = 0, -40

    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgba(4C566AFF)
    inner_color = rgba(2E3440EE)
    font_color = rgba(D8DEE9FF)

    check_color = rgba(A3BE8CFF)
    fail_color = rgba(BF616AFF)

    fade_on_empty = false
    dots_center = true

    placeholder_text = Password
    font_family = JetBrainsMono Nerd Font
}
